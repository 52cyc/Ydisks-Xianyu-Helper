# SQLite 源码构建部署：不启动 PostgreSQL，镜像内包含 Playwright 与 Chromium。
services:
  app:
    image: ${XIANYU_IMAGE:-ydisks-xianyu-helper:sqlite}
    build:
      context: .
      dockerfile: Dockerfile.debian13
      args:
        PLAYWRIGHT_GO_NPM_REGISTRY: ${PLAYWRIGHT_GO_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite://data/xianyu_data.db
      XIANYU_DATA_KEY: ${XIANYU_DATA_KEY:?请在 .env 中配置 XIANYU_DATA_KEY}
      XIANYU_ADMIN_PASSWORD: ${XIANYU_ADMIN_PASSWORD:?请在 .env 中配置 XIANYU_ADMIN_PASSWORD}
      XIANYU_UPLOAD_DIR: ${XIANYU_UPLOAD_DIR:-/app/data/uploads}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
    command: ["/app/xianyu-server", "-addr", ":59188", "-ensure-admin"]
    ports:
      - "${XIANYU_BIND_ADDRESS:-127.0.0.1}:${XIANYU_HTTP_PORT:-59188}:59188"
    volumes:
      - app_data:/app/data
      - browser_data:/app/browser_data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:59188/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_data:
  browser_data:
